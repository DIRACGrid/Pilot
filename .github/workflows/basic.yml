name: Basic tests

on: [push, pull_request]

# A new push to the same branch/PR cancels the previous run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:

  shellcheck:
    name: shellcheck
    runs-on: ubuntu-26.04
    if: github.event_name != 'push' || github.repository == 'DIRACGrid/DIRAC'
    timeout-minutes: 10

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - name: Run shellcheck
      run: |
        find tests/CI -name '*.sh' -print0 | xargs -0 -n1 shellcheck --external-sources;

  pycodestyle:
    name: pycodestyle (${{ matrix.python }})
    runs-on: ubuntu-26.04
    if: github.event_name != 'push' || github.repository == 'DIRACGrid/Pilot'
    timeout-minutes: 10

    strategy:
      fail-fast: false
      matrix:
        include:
          - python: 3.6.15
            image: python@sha256:28028f6c3ce569a6405909ca76e85469fbb85c9ee93acd2fe5fe13f5e5e2c412
          - python: 3.9.17
            image: python@sha256:42a5da33675ec5a692e8cdbb09ffa4e39588c10dd9a96235e543c498484ee18e

    container: ${{ matrix.image }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - name: Installing dependencies
      run: |
        python -m pip install pycodestyle
    - name: Run pycodestyle
      run: |
        if [[ "${REFERENCE_BRANCH}" != "" ]]; then
            git remote add upstream https://github.com/DIRACGrid/Pilot.git
            git fetch --no-tags upstream "${REFERENCE_BRANCH}"
            git branch -vv
            git diff -U0 "upstream/${REFERENCE_BRANCH}" | pycodestyle --diff
        fi
      env:
        REFERENCE_BRANCH: ${{ github['base_ref'] || github['head_ref'] }}


  pytest:
    name: pytest (${{ matrix.python }})
    runs-on: ubuntu-26.04
    if: github.event_name != 'push' || github.repository == 'DIRACGrid/Pilot'
    timeout-minutes: 10

    strategy:
      fail-fast: false
      matrix:
        include:
          - python: 3.6.15
            image: python@sha256:28028f6c3ce569a6405909ca76e85469fbb85c9ee93acd2fe5fe13f5e5e2c412
          - python: 3.9.17
            image: python@sha256:42a5da33675ec5a692e8cdbb09ffa4e39588c10dd9a96235e543c498484ee18e

    container: ${{ matrix.image }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - name: Installing dependencies
      run: |
        echo 'deb http://archive.debian.org/debian stretch main' > /etc/apt/sources.list
        echo 'deb http://archive.debian.org/debian-security stretch/updates main' >> /etc/apt/sources.list
        apt-get update || true
        python -m pip install pytest mock
        apt install -y voms-clients
    - name: Run pytest
      run: pytest


  pylint:
    name: pylint (${{ matrix.python }})
    runs-on: ubuntu-26.04
    if: github.event_name != 'push' || github.repository == 'DIRACGrid/Pilot'
    timeout-minutes: 10

    strategy:
      fail-fast: false
      matrix:
        include:
          - python: 3.6.15
            image: python@sha256:28028f6c3ce569a6405909ca76e85469fbb85c9ee93acd2fe5fe13f5e5e2c412
          - python: 3.9.17
            image: python@sha256:42a5da33675ec5a692e8cdbb09ffa4e39588c10dd9a96235e543c498484ee18e

    container: ${{ matrix.image }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - name: Installing dependencies
      run: |
        python -m pip install pylint
    - name: Run pylint
      run: pylint -E Pilot/

          VO: ${{ matrix.VO }}
          HOSTCERT_BASE64: ${{ secrets.HOSTCERT_BASE64 }} # zizmor: ignore[secrets-outside-env] fork-level test certificates; no GitHub environment
          HOSTKEY_BASE64: ${{ secrets.HOSTKEY_BASE64 }} # zizmor: ignore[secrets-outside-env] fork-level test certificates; no GitHub environment
          X509_CERT_DIR: /cvmfs/grid.cern.ch/etc/grid-security/certificates
          X509_VOMS_DIR: /cvmfs/grid.cern.ch/etc/grid-security/vomsdir

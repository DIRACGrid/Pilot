  ##################################
  ### # extensions tests
  ##################################

  ##################################
  #### LHCb

  ext-lhcb_integration:
    name: ext-lhcb_integration
    if: github.repository_owner != 'DIRACGrid'
    runs-on: ubuntu-latest

    strategy:
      matrix:
        pilot_schema:
          - pilot_oldSchema.json
          - pilot_newSchema.json
        pilot_version:
          - master
          - devel

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: cvmfs-contrib/github-action-cvmfs@d705955b32075b4b0178f3a0160b6fe527483cf8 # v5

      - name: Test CernVM-FS

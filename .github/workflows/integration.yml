          sed -i "s#VAR_PREF_URL_PATTERN#.*\.cern\.ch/.*#g" pilot.json
          g_job="testintegrationworkflow${GITHUB_JOB//-/}"
          pilotUUID="${g_job//_/}""$(shuf -i 2000-65000 -n 1)"
          pilotUUID=$(echo $pilotUUID | rev | cut -c 1-32 | rev)
          X509_USER_PROXY=$pilot_proxy_file python dirac-pilot.py -M 1 -S DIRAC-Certification -N jenkins-full.cern.ch -Q jenkins-queue_not_important -n DIRAC.Jenkins.ch --preinstalledEnvPrefix=/cvmfs/dirac.egi.eu/dirac --wnVO="${VO}" -o cvmfsOnly --pilotUUID="${pilotUUID}" --debug

  release_prod-cvmfs_matching_CEs:
    name: release_prod-cvmfs_matching_CEs
    if: github.repository_owner != 'DIRACGrid'
    runs-on: ubuntu-latest

